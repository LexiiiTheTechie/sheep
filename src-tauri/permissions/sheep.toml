# Application-level permissions for commands that the local
# frontend page is allowed to call.

[[permission]]
identifier = "allow-ping"
description = "Smoke-test IPC round trip."
commands.allow = ["ping"]

[[permission]]
identifier = "allow-pick-directory"
description = "Open the native folder picker for the model directory field."
commands.allow = ["pick_directory"]

[[permission]]
identifier = "allow-open-external"
description = "Open http(s) links in the system browser."
commands.allow = ["open_external"]

[[permission]]
identifier = "allow-auth"
description = "Native authentication, sessions, and slot manager commands."
commands.allow = [
  "check_first_run",
  "setup_owner",
  "login",
  "get_current_user",
  "logout",
  "get_user_sessions",
  "revoke_session",
  "update_password",
  "delete_account",
  "get_slot_status",
  "claim_slot",
  "release_slot",
  "admin_force_release",
  "set_max_active_users"
]
