name: Build Vulkan

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag of textgen to build: v3.0'
        default: 'v3.0'
        required: true
        type: string
      config:
        description: 'Override configurations to build: key1:item1-1,item1-2;key2:item2-1,item2-2'
        default: 'Default'
        required: false
        type: string
      exclude:
        description: 'Exclude build configurations: key1-1:item1-1,key1-2:item1-2;key2-1:item2-1,key2-2:item2-2'
        default: 'None'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version tag of textgen to build: v3.0'
        default: 'v3.0'
        required: true
        type: string
      config:
        description: 'Configurations to build: key1:item1-1,item1-2;key2:item2-1,item2-2'
        default: 'Default'
        required: false
        type: string
      exclude:
        description: 'Exclude build configurations: key1-1:item1-1,key1-2:item1-2;key2-1:item2-1,key2-2:item2-2'
        default: 'None'
        required: false
        type: string

permissions:
  contents: write

jobs:
  define_matrix:
    name: Define Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    defaults:
      run:
        shell: pwsh
    env:
      CONFIGIN: ${{ inputs.config }}
      EXCLUDEIN: ${{ inputs.exclude }}

    steps:
      - name: Define Job Output
        id: set-matrix
        run: |
          $matrix = @{
              'os' = @('ubuntu-22.04', 'windows-2022')
              'pyver' = @("3.13")
          }

          if ($env:CONFIGIN -ne 'Default') {$env:CONFIGIN.split(';').foreach({$matrix[$_.split(':')[0]] = $_.split(':')[1].split(',')})}

          # Apple Silicon only: drop any Intel macOS runner added via config.
          $matrix['os'] = @($matrix['os'] | Where-Object { $_ -notmatch 'intel' })

          if ($env:EXCLUDEIN -ne 'None') {
              $exclusions = @()
              $exclusions += $env:EXCLUDEIN.split(';').replace(':','=').replace(',',"`n") | ConvertFrom-StringData
              $matrix['exclude'] = $exclusions
          }

          $matrixOut = ConvertTo-Json $matrix -Compress
          Write-Output ('matrix=' + $matrixOut) >> $env:GITHUB_OUTPUT

  build_wheels:
    name: ${{ matrix.os }} ${{ matrix.pyver }}
    needs: define_matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJSON(needs.define_matrix.outputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    env:
      PCKGVER: ${{ inputs.version }}

    steps:
      # Build this fork, not upstream: src-tauri/ only exists here.
      # `inputs.version` is now a release label, not the checkout ref.
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.pyver }}

      - name: Build Package
        shell: bash
        run: |
            VERSION_CLEAN="${{ inputs.version }}"
            VERSION_CLEAN="${VERSION_CLEAN#v}"
            cd ..
            cp -r textgen "textgen-${VERSION_CLEAN}"
            cd "textgen-${VERSION_CLEAN}"

            # Remove extensions that need additional requirements
            allowed=("character_bias" "gallery" "sd_api_pictures")
            find extensions/ -mindepth 1 -maxdepth 1 -type d | grep -v -E "$(printf '%s|' "${allowed[@]}" | sed 's/|$//')" | xargs rm -rf

            # Define common variables
            VERSION="${{ inputs.version }}"

            # 1. Set platform-specific variables
            if [[ "$RUNNER_OS" == "Windows" ]]; then
                PLATFORM="windows"
                PYTHON_URL="https://github.com/astral-sh/python-build-standalone/releases/download/20260303/cpython-3.13.12+20260303-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
                PIP_PATH="portable_env/python.exe -m pip"
                PACKAGES_PATH="portable_env/Lib/site-packages"
                rm start_linux.sh start_macos.sh
            else
                PLATFORM="linux"
                PYTHON_URL="https://github.com/astral-sh/python-build-standalone/releases/download/20260303/cpython-3.13.12+20260303-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz"
                PIP_PATH="portable_env/bin/python -m pip"
                PACKAGES_PATH="portable_env/lib/python3.13/site-packages"
                rm start_macos.sh start_windows.bat
            fi

            # 2. Download and extract Python
            cd ..
            echo "Downloading Python for $PLATFORM..."
            curl -L -o python-build.tar.gz "$PYTHON_URL"
            tar -xzf python-build.tar.gz
            mv python "textgen-${VERSION_CLEAN}/portable_env"

            # 3. Prepare requirements file
            REQ_FILE="requirements/portable/requirements_vulkan.txt"

            cd "textgen-${VERSION_CLEAN}"

            # 4. Install packages
            echo "Installing Python packages from $REQ_FILE..."
            $PIP_PATH install --target="./$PACKAGES_PATH" -r "$REQ_FILE"

            # 5. Clean up
            rm -rf .git cmd* update_wizard* Colab-TextGen-GPU.ipynb docker setup.cfg .github .gitignore requirements/ one_click.py

            # 5b. Build the Sheep desktop shell (Tauri)
            APP_DIR="app"
            if [[ "$RUNNER_OS" == "Windows" ]]; then
                SHELL_REL="sheep.exe"
                rm -f start_windows.bat
            elif [[ "$RUNNER_OS" == "macOS" ]]; then
                SHELL_REL="Sheep.app/Contents/MacOS/sheep"
                rm -f start_macos.sh
            else
                SHELL_REL="sheep"
                rm -f start_linux.sh
            fi

            echo "Installing the Tauri CLI..."
            cargo install tauri-cli --version "^2" --locked

            echo "Building the Sheep shell for ${RUNNER_OS}..."
            if [[ "$RUNNER_OS" == "macOS" ]]; then
                ( cd src-tauri && cargo tauri build --bundles app --config "{\"version\": \"${VERSION_CLEAN}\"}" )
                cp -R src-tauri/target/release/bundle/macos/Sheep.app .
            else
                ( cd src-tauri && cargo tauri build --no-bundle --config "{\"version\": \"${VERSION_CLEAN}\"}" )
                cp "src-tauri/target/release/sheep" "./${SHELL_REL}"
            fi

            # Launchers are generated before the Rust tree is dropped.
            if [[ "$RUNNER_OS" == "Windows" ]]; then
                sed -e "s|__APP__|${APP_DIR}|g" -e "s|__SHELL__|${SHELL_REL}|g" \
                    src-tauri/portable/textgen.bat > textgen.bat
                sed -i 's/$/\r/' textgen.bat
            else
                sed -e "s|__APP__|${APP_DIR}|g" -e "s|__SHELL__|${SHELL_REL}|g" \
                    src-tauri/portable/textgen.sh > textgen
                chmod +x textgen
            fi

            # Neither the Electron wrapper nor the Rust sources ship in a release.
            rm -rf src-tauri desktop

            # 5c. Restructure: textgen-VERSION/{textgen, user_data/, app/<everything else>}
            mkdir "${APP_DIR}"
            shopt -s dotglob
            for item in *; do
                case "$item" in
                    "${APP_DIR}"|user_data|textgen|textgen.bat) ;;
                    *) mv "$item" "${APP_DIR}/" ;;
                esac
            done
            shopt -u dotglob

            # 6. Create archive
            cd ..
            if [[ "$RUNNER_OS" == "Windows" ]]; then
                ARCHIVE_NAME="textgen-portable-${VERSION_CLEAN}-${PLATFORM}-vulkan.zip"
                echo "Creating archive: $ARCHIVE_NAME"
                powershell -Command "Compress-Archive -Path textgen-${VERSION_CLEAN} -DestinationPath $ARCHIVE_NAME"
            else
                ARCHIVE_NAME="textgen-portable-${VERSION_CLEAN}-${PLATFORM}-vulkan.tar.gz"
                echo "Creating archive: $ARCHIVE_NAME"
                tar czf "$ARCHIVE_NAME" "textgen-${VERSION_CLEAN}"
            fi

      - name: Upload files to a GitHub release
        id: upload-release
        uses: svenstaro/upload-release-action@2.7.0
        continue-on-error: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ../textgen-portable-*
          tag: ${{ inputs.version }}
          file_glob: true
          make_latest: false
          overwrite: true
